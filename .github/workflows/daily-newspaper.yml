name: Daily Editorial Extraction

on:
  schedule:
    # Run daily at 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'

  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: write
  issues: write  # failure reports are delivered as a GitHub Issue (see below)

jobs:
  extract-editorial:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check out the artifacts branch
        # Artifacts are not committed to main. main's history was growing
        # ~1.7 MB/day and can never shrink -- the 7-day prune keeps the
        # working tree small while every deleted byte stays in history
        # forever. They live on their own branch instead, checked out here
        # as a worktree so the extraction step writes the rolling window
        # straight into it (and so cleanup_stale_artifacts can see the
        # older days it needs to prune).
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin artifacts >/dev/null 2>&1; then
            git fetch --depth=1 origin artifacts
            git worktree add --detach .artifacts-worktree FETCH_HEAD
          else
            # First run: start the branch from an empty tree. Done with
            # plumbing rather than `worktree add --orphan`, which needs a
            # git version we shouldn't have to assume on the runner.
            empty_tree=$(git hash-object -w -t tree /dev/null)
            empty_commit=$(git commit-tree "$empty_tree" -m "artifacts: start")
            git worktree add --detach .artifacts-worktree "$empty_commit"
          fi

      - name: Run editorial extraction
        id: extract
        env:
          # Write artifacts into the artifacts-branch worktree. ARTIFACTS_DIR
          # is blanked so the date folders sit at the branch root, keeping
          # raw URLs as /<repo>/artifacts/YYYY-MM-DD/... instead of doubling
          # the word.
          ARTIFACTS_ROOT: .artifacts-worktree
          ARTIFACTS_DIR: ""
        run: |
          python scraper.py

      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Editorial Update - $(date +'%Y-%m-%d')"
            git push
          fi
        continue-on-error: true

      - name: Push the artifacts branch
        # Force-pushed as a SINGLE commit every run. The branch is a rolling
        # mirror of the live 7-day window -- its history carries no
        # information and would otherwise grow exactly as main's did.
        # Collapsing it each time bounds the branch permanently at one
        # window's worth of files. Old blobs become unreachable; GitHub
        # prunes them on its own schedule.
        if: always()
        run: |
          set -euo pipefail

          if [ ! -d .artifacts-worktree ]; then
            echo "No artifacts worktree (extraction never got that far)"
            exit 0
          fi

          # commit-tree needs an identity of its own; don't rely on the
          # previous step having set one.
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git -C .artifacts-worktree add -A
          if git -C .artifacts-worktree diff --cached --quiet; then
            echo "No artifact changes to push"
            exit 0
          fi

          tree=$(git -C .artifacts-worktree write-tree)
          commit=$(git -C .artifacts-worktree commit-tree "$tree" \
            -m "Artifacts - $(date +'%Y-%m-%d')")
          git push --force origin "$commit":refs/heads/artifacts

      - name: Rebuild site and wait for the deploy
        # A GITHUB_TOKEN push (the commit above) does not trigger other
        # workflows' `on: push` -- dispatch pages.yml explicitly instead.
        #
        # We wait for it rather than firing and forgetting, because the
        # Discord message is now a link to the published page instead of
        # an attachment. Posting before Pages has deployed would hand
        # readers a URL that 404s for a minute or two.
        id: deploy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # `gh workflow run` is asynchronous and returns no run id, so
          # note the newest run before dispatching and poll until a newer
          # one appears. Matching on "newest id changed" rather than
          # guessing avoids watching the *previous* run to completion and
          # declaring success before ours has even started.
          before=$(gh run list --workflow=pages.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run pages.yml

          run_id="$before"
          for _ in $(seq 1 30); do
            sleep 5
            run_id=$(gh run list --workflow=pages.yml --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0')
            if [ "$run_id" != "$before" ]; then break; fi
          done

          if [ "$run_id" = "$before" ]; then
            echo "::warning::pages.yml run never appeared -- skipping the Discord link"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh run watch "$run_id" --exit-status; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pages.yml deploy failed -- skipping the Discord link"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post the Discord link
        # Only once the page it points at is actually live. notify.py is a
        # no-op when nothing was published this run (no notify.json), which
        # is what keeps manual re-runs from double-posting.
        if: always() && steps.deploy.outputs.deployed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py

      - name: Report problems as a GitHub Issue
        # Runs on success too: the early-warning report (chain surviving on
        # a fallback locator) fires while everything still works, and that
        # is precisely when it's worth hearing about.
        #
        # Delivered as an Issue rather than a Discord message because the
        # Discord webhook points at a public community server. GitHub mails
        # the full issue body from notifications@github.com, which lands in
        # the same inbox as the automated run-failure mail -- whose own
        # template can't carry custom text.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Editorial extraction needs attention"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # One open issue at a time, matched on exact title, so a break
          # that persists for days adds comments instead of mailing a new
          # issue every run. Listed and filtered locally rather than via
          # `--search`, which goes through GitHub's search index and can
          # lag behind a just-created issue -- long enough to open a
          # duplicate on the next run.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -s failure-report.md ]; then
            { cat failure-report.md; echo; echo "[Run log]($RUN_URL)"; } > issue-body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file issue-body.md
            else
              gh issue create --title "$TITLE" --body-file issue-body.md
            fi
          elif [ -n "$existing" ] && [ "${{ steps.extract.outcome }}" = "success" ]; then
            gh issue comment "$existing" \
              --body "Recovered — [this run]($RUN_URL) completed with no problems reported. Closing."
            gh issue close "$existing"
          fi

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
            hop-*.html
            failure-report.md
          retention-days: 7
