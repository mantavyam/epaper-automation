name: Daily Editorial Extraction

on:
  schedule:
    # Run daily at 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'

  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: write
  issues: write  # failure reports are delivered as a GitHub Issue (see below)

jobs:
  extract-editorial:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run editorial extraction
        id: extract
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scraper.py

      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Editorial Update - $(date +'%Y-%m-%d')"
            git push
          fi
        continue-on-error: true

      - name: Trigger site rebuild
        # A GITHUB_TOKEN push (the commit above) does not trigger other
        # workflows' `on: push` -- dispatch pages.yml explicitly instead.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml

      - name: Report problems as a GitHub Issue
        # Runs on success too: the early-warning report (chain surviving on
        # a fallback locator) fires while everything still works, and that
        # is precisely when it's worth hearing about.
        #
        # Delivered as an Issue rather than a Discord message because the
        # Discord webhook points at a public community server. GitHub mails
        # the full issue body from notifications@github.com, which lands in
        # the same inbox as the automated run-failure mail -- whose own
        # template can't carry custom text.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Editorial extraction needs attention"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # One open issue at a time, matched on exact title, so a break
          # that persists for days adds comments instead of mailing a new
          # issue every run. Listed and filtered locally rather than via
          # `--search`, which goes through GitHub's search index and can
          # lag behind a just-created issue -- long enough to open a
          # duplicate on the next run.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -s failure-report.md ]; then
            { cat failure-report.md; echo; echo "[Run log]($RUN_URL)"; } > issue-body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file issue-body.md
            else
              gh issue create --title "$TITLE" --body-file issue-body.md
            fi
          elif [ -n "$existing" ] && [ "${{ steps.extract.outcome }}" = "success" ]; then
            gh issue comment "$existing" \
              --body "Recovered — [this run]($RUN_URL) completed with no problems reported. Closing."
            gh issue close "$existing"
          fi

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
            hop-*.html
            failure-report.md
          retention-days: 7
