name: Deploy E-Paper Site

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'site_publish.py'
      - 'releases.py'
      - 'common.py'
  workflow_dispatch:  # Allow manual trigger, independent of a push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build date pages from releases
        # Downloads each live release's files into app/files/ and writes
        # app/_posts/ -- served same-origin, since release assets can't be
        # fetched cross-origin by the PDF.js viewer. Stdlib + gh only.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python site_publish.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: app

      - name: Build with Jekyll
        working-directory: app
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/_site

  deploy:
    # Only main deploys: a branch build (workflow_dispatch --ref) still
    # runs the build job and uploads its artifact for inspection, but must
    # never replace the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
