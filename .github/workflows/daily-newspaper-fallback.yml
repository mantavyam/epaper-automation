name: Daily Editorial Extraction (Fallback)

on:
  workflow_dispatch:  # Triggered by the primary workflow on failure, or manually

permissions:
  contents: write
  actions: write

jobs:
  extract-editorial-fallback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fallback editorial extraction
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python fallback_scraper.py

      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Editorial Update (fallback) - $(date +'%Y-%m-%d')"
            git push
          fi
        continue-on-error: true

      - name: Trigger site rebuild
        # A GITHUB_TOKEN push (the commit above) does not trigger other
        # workflows' `on: push` -- dispatch pages.yml explicitly instead.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml

      - name: Upload artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fallback-error-logs
          path: |
            *.log
            *.html
          retention-days: 7
