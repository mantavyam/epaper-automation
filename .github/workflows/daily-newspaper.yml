name: Daily Editorial Extraction (Primary)

on:
  schedule:
    # Run daily at 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'

  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  extract-editorial:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run primary editorial extraction
        id: extract
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scraper.py

      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Editorial Update (primary) - $(date +'%Y-%m-%d')"
            git push
          fi
        continue-on-error: true

      - name: Trigger fallback workflow
        if: failure() && steps.extract.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run daily-newspaper-fallback.yml

      - name: Trigger site rebuild
        # A GITHUB_TOKEN push (the commit above) does not trigger other
        # workflows' `on: push` -- dispatch pages.yml explicitly instead.
        if: steps.extract.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml

      - name: Upload artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
            *.html
          retention-days: 7
